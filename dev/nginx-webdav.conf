load_module modules/ngx_http_dav_ext_module.so;

events {
    worker_connections 64;
}

http {
    server {
        listen 8080;
        server_name localhost;

        root /var/webdav;
        client_max_body_size 50m;

        # CORS headers for browser access
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, PUT, DELETE, MKCOL, PROPFIND, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Depth, Overwrite, Destination" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Type" always;

        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, PUT, DELETE, MKCOL, PROPFIND, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Depth, Overwrite, Destination";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        auth_basic "Noti WebDAV";
        auth_basic_user_file /etc/nginx/htpasswd;

        dav_methods PUT DELETE MKCOL;
        dav_ext_methods PROPFIND OPTIONS;
        dav_access user:rw group:rw all:r;
        create_full_put_path on;

        autoindex on;
    }
}
